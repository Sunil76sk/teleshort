<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TeleShort Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{font-family:Inter,system-ui,sans-serif;background:#0f172a;color:#f8fafc}.card{background:#1e293b;border:1px solid #334155;border-radius:16px}.nav{color:#94a3b8}.nav.active{background:#4f46e5;color:white}.hidden{display:none!important}button:disabled{opacity:.5}</style>
</head>
<body class="min-h-screen">
<div id="login" class="min-h-screen flex items-center justify-center p-5">
  <form id="loginForm" class="card w-full max-w-sm p-7">
    <h1 class="text-2xl font-bold mb-2">TeleShort Admin</h1>
    <p class="text-sm text-slate-400 mb-6">Secure administrator sign-in</p>
    <input id="username" autocomplete="username" required placeholder="Username" class="w-full mb-3 p-3 rounded bg-slate-900 border border-slate-700">
    <input id="password" type="password" autocomplete="current-password" required placeholder="Password" class="w-full mb-4 p-3 rounded bg-slate-900 border border-slate-700">
    <button class="w-full p-3 rounded bg-indigo-600 font-bold">Sign in</button>
    <p id="loginError" class="text-red-400 text-sm mt-3"></p>
  </form>
</div>

<div id="app" class="hidden min-h-screen md:flex">
  <aside class="w-64 shrink-0 bg-slate-950 border-r border-slate-800 p-4 hidden md:flex flex-col">
    <h1 class="font-bold text-xl mb-6">⚡ TeleShort</h1>
    <nav class="space-y-2 flex-1">
      <button data-tab="dashboard" class="nav active w-full text-left p-3 rounded">Dashboard</button>
      <button data-tab="users" class="nav w-full text-left p-3 rounded">Users</button>
      <button data-tab="withdrawals" class="nav w-full text-left p-3 rounded">Withdrawals</button>
      <button data-tab="settings" class="nav w-full text-left p-3 rounded">Settings</button>
      <button data-tab="broadcast" class="nav w-full text-left p-3 rounded">Broadcast</button>
      <button data-tab="audit" class="nav w-full text-left p-3 rounded">Audit Logs</button>
    </nav>
    <button id="logout" class="p-3 rounded bg-red-950 text-red-300">Logout</button>
  </aside>
  <main class="flex-1 min-w-0 p-4 md:p-8 overflow-auto">
    <div class="md:hidden flex gap-2 overflow-auto mb-5 pb-1">
      <button data-tab="dashboard" class="nav active px-3 py-2 rounded whitespace-nowrap">Dashboard</button>
      <button data-tab="users" class="nav px-3 py-2 rounded whitespace-nowrap">Users</button>
      <button data-tab="withdrawals" class="nav px-3 py-2 rounded whitespace-nowrap">Payouts</button>
      <button data-tab="settings" class="nav px-3 py-2 rounded whitespace-nowrap">Settings</button>
      <button data-tab="broadcast" class="nav px-3 py-2 rounded whitespace-nowrap">Broadcast</button>
      <button data-tab="audit" class="nav px-3 py-2 rounded whitespace-nowrap">Audit</button>
    </div>
    <section id="content"></section>
  </main>
</div>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,options={}){const r=await fetch(path,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(options.headers||{})},...options});const d=await r.json().catch(()=>({success:false,error:'Invalid server response'}));if(!r.ok||d.success===false)throw new Error(d.error||`HTTP ${r.status}`);return d;}
function showLogin(){ $('#login').classList.remove('hidden');$('#app').classList.add('hidden'); }
function showApp(){ $('#login').classList.add('hidden');$('#app').classList.remove('hidden'); }
async function login(e){e.preventDefault();$('#loginError').textContent='';try{await api('/api/admin/auth/login',{method:'POST',body:JSON.stringify({username:$('#username').value.trim(),password:$('#password').value})});showApp();loadTab('dashboard')}catch(x){$('#loginError').textContent=x.message}}
async function logout(){try{await api('/api/admin/auth/logout',{method:'POST',body:JSON.stringify({action:'logout'})})}finally{showLogin()}}
function setNav(tab){$$('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab))}
async function loadTab(tab){setNav(tab);const c=$('#content');c.innerHTML='<div class="card p-8 text-slate-400">Loading…</div>';try{if(tab==='dashboard')return dashboard();if(tab==='users')return users();if(tab==='withdrawals')return withdrawals();if(tab==='settings')return settings();if(tab==='broadcast')return broadcast();if(tab==='audit')return audit()}catch(x){c.innerHTML=`<div class="card p-6 text-red-400">${esc(x.message)}</div>`}}
function money(n){return `₹${Number(n||0).toFixed(4)}`}
async function dashboard(){const d=await api('/api/admin/dashboard?range=7d');const x=d.data||d;$('#content').innerHTML=`<h2 class="text-2xl font-bold mb-6">Dashboard</h2><div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4">${[['Users',x.users?.total],['New (7d)',x.users?.new_in_period],['Links',x.links?.total],['Clicks',x.traffic?.total_clicks],['Eligible',x.traffic?.eligible_clicks],['Creator rewards',money(x.financial?.total_creator_rewards_inr)],['Referral rewards',money(x.financial?.total_referral_rewards_inr)],['Pending payouts',money(x.financial?.pending_withdrawals_inr)]].map(([a,b])=>`<div class="card p-5"><div class="text-xs text-slate-400 uppercase">${a}</div><div class="text-2xl font-bold mt-2">${esc(b)}</div></div>`).join('')}</div><div class="card p-5 mt-5"><h3 class="font-bold mb-3">Ad funnel</h3><pre class="text-sm text-slate-300 whitespace-pre-wrap">${esc(JSON.stringify(x.ad_funnel||{},null,2))}</pre></div>`}
async function users(){const d=await api('/api/admin/users?limit=50');const rows=d.data?.users||d.users||[];$('#content').innerHTML=`<h2 class="text-2xl font-bold mb-5">Users</h2><div class="card overflow-auto"><table class="w-full text-sm"><thead><tr class="border-b border-slate-700 text-slate-400"><th class="p-3 text-left">ID</th><th class="p-3 text-left">User</th><th class="p-3">Balance</th><th class="p-3">Status</th><th class="p-3">Action</th></tr></thead><tbody>${rows.map(u=>`<tr class="border-b border-slate-800"><td class="p-3">${esc(u.id)}</td><td class="p-3">${esc(u.username||u.first_name||'-')}</td><td class="p-3 text-center">${money(u.available_balance)}</td><td class="p-3 text-center">${esc(u.status)}</td><td class="p-3 text-center"><button class="px-3 py-1 rounded bg-slate-700" onclick="userAction('${esc(u.id)}','${String(u.status).toUpperCase()==='BANNED'?'UNBAN':'BAN'}')">${String(u.status).toUpperCase()==='BANNED'?'Unban':'Ban'}</button></td></tr>`).join('')}</tbody></table></div>`}
async function userAction(id,action){const reason=prompt(`Reason for ${action}:`);if(['BAN','SUSPEND'].includes(action)&&!reason)return;await api(`/api/admin/users/${encodeURIComponent(id)}`,{method:'POST',body:JSON.stringify({action,reason})});users()}
async function withdrawals(){const d=await api('/api/admin/withdrawals?limit=50');const rows=d.data?.withdrawals||d.withdrawals||[];$('#content').innerHTML=`<h2 class="text-2xl font-bold mb-5">Withdrawals</h2><div class="card overflow-auto"><table class="w-full text-sm"><thead><tr class="border-b border-slate-700 text-slate-400"><th class="p-3">ID</th><th class="p-3">User</th><th class="p-3">Amount</th><th class="p-3">Method</th><th class="p-3">Status</th><th class="p-3">Action</th></tr></thead><tbody>${rows.map(w=>`<tr class="border-b border-slate-800"><td class="p-3">${esc(w.id)}</td><td class="p-3">${esc(w.user_id)}</td><td class="p-3">${money(w.amount)}</td><td class="p-3">${esc(w.payment_method||w.method)}</td><td class="p-3">${esc(w.status)}</td><td class="p-3">${['PENDING','UNDER_REVIEW','APPROVED','PROCESSING'].includes(String(w.status).toUpperCase())?`<button class="px-2 py-1 rounded bg-emerald-700 mr-1" onclick="decide('${esc(w.id)}','APPROVED')">Approve</button><button class="px-2 py-1 rounded bg-red-800" onclick="decide('${esc(w.id)}','REJECTED')">Reject</button>`:'-'}</td></tr>`).join('')}</tbody></table></div>`}
async function decide(id,status){const notes=prompt(status==='REJECTED'?'Rejection reason (required):':'Admin notes (optional):');if(status==='REJECTED'&&!notes)return;const tx=status==='APPROVED'?prompt('Payout transaction ID (optional):'):'';await api(`/api/admin/withdrawals/${encodeURIComponent(id)}/decision`,{method:'POST',body:JSON.stringify({status,admin_notes:notes||null,payout_tx_id:tx||null})});withdrawals()}
async function settings(){const d=await api('/api/admin/settings');const s=d.data?.settings||d.settings||{};const cpm=s.publisher_payout_cpm?.rate_inr??160,ref=s.referral_config?.commission_percent??10,ads=s.ads_config?.ads_per_link??2,timer=s.ads_config?.timer_seconds??5,min=s.withdrawal_config?.min_threshold_inr??100,maint=!!s.maintenance_config?.enabled;const social=s.social_links||{};$('#content').innerHTML=`<h2 class="text-2xl font-bold mb-5">Settings</h2><div class="card p-6 max-w-3xl space-y-5"><div class="grid sm:grid-cols-2 gap-4"><label>Publisher CPM (₹)<input id="sCpm" type="number" min="0" step="0.01" value="${esc(cpm)}" class="w-full mt-1 p-3 rounded bg-slate-900 border border-slate-700"></label><label>Referral %<input id="sRef" type="number" min="0" max="100" value="${esc(ref)}" class="w-full mt-1 p-3 rounded bg-slate-900 border border-slate-700"></label><label>Ads per link<input id="sAds" type="number" min="1" max="5" value="${esc(ads)}" class="w-full mt-1 p-3 rounded bg-slate-900 border border-slate-700"></label><label>Timer seconds<input id="sTimer" type="number" min="1" max="60" value="${esc(timer)}" class="w-full mt-1 p-3 rounded bg-slate-900 border border-slate-700"></label><label>Minimum withdrawal (₹)<input id="sMin" type="number" min="1" step="0.01" value="${esc(min)}" class="w-full mt-1 p-3 rounded bg-slate-900 border border-slate-700"></label><label>Maintenance<input id="sMaint" type="checkbox" ${maint?'checked':''} class="ml-3"></label><label>Telegram URL<input id="sTg" value="${esc(social.telegram_url||'')}" class="w-full mt-1 p-3 rounded bg-slate-900 border border-slate-700"></label><label>YouTube URL<input id="sYt" value="${esc(social.youtube_url||'')}" class="w-full mt-1 p-3 rounded bg-slate-900 border border-slate-700"></label></div><button id="saveSettings" class="px-5 py-3 rounded bg-indigo-600 font-bold">Save settings</button><p id="settingsMsg" class="text-sm"></p></div>`;$('#saveSettings').onclick=saveSettings}
async function saveSettings(){const msg=$('#settingsMsg');try{const ops=[['publisher_payout_cpm',{rate_inr:Number($('#sCpm').value)}],['referral_config',{commission_percent:Number($('#sRef').value)}],['ads_config',{ads_per_link:Number($('#sAds').value),timer_seconds:Number($('#sTimer').value)}],['withdrawal_config',{min_threshold_inr:Number($('#sMin').value)}],['maintenance_config',{enabled:$('#sMaint').checked}],['social_links',{telegram_url:$('#sTg').value.trim(),youtube_url:$('#sYt').value.trim()}]];for(const [key,value] of ops)await api('/api/admin/settings',{method:'PATCH',body:JSON.stringify({key,value,reason:'Admin settings update'})});msg.className='text-emerald-400 text-sm';msg.textContent='Saved successfully.'}catch(x){msg.className='text-red-400 text-sm';msg.textContent=x.message}}
async function broadcast(){const d=await api('/api/admin/broadcasts?limit=20');const rows=d.data?.broadcasts||d.broadcasts||[];$('#content').innerHTML=`<h2 class="text-2xl font-bold mb-5">Broadcast</h2><div class="card p-6 max-w-3xl mb-5"><textarea id="bMsg" rows="5" maxlength="4000" placeholder="Message" class="w-full p-3 rounded bg-slate-900 border border-slate-700"></textarea><div class="grid sm:grid-cols-2 gap-3 mt-3"><input id="bImg" placeholder="Image URL (optional)" class="p-3 rounded bg-slate-900 border border-slate-700"><input id="bBtn" placeholder="Button text (optional)" class="p-3 rounded bg-slate-900 border border-slate-700"><input id="bUrl" placeholder="Button URL (optional)" class="p-3 rounded bg-slate-900 border border-slate-700"><select id="bAudience" class="p-3 rounded bg-slate-900 border border-slate-700"><option>ALL_USERS</option><option>ACTIVE_USERS</option><option>USERS_WITH_BALANCE</option><option>USERS_WITH_REFERRALS</option></select></div><button id="createBroadcast" class="mt-4 px-5 py-3 rounded bg-amber-600 font-bold">Create draft</button><p id="bMsgOut" class="text-sm mt-3"></p></div><div class="card p-5"><h3 class="font-bold mb-3">Recent broadcasts</h3>${rows.map(r=>`<div class="border-b border-slate-700 py-3"><div class="font-medium">${esc(r.message)}</div><div class="text-xs text-slate-400">${esc(r.status)} · ${esc(r.created_at)}</div></div>`).join('')||'<div class="text-slate-400">No broadcasts.</div>'}</div>`;$('#createBroadcast').onclick=createBroadcast}
async function createBroadcast(){const out=$('#bMsgOut');try{const d=await api('/api/admin/broadcasts',{method:'POST',body:JSON.stringify({message:$('#bMsg').value,image_url:$('#bImg').value,button_text:$('#bBtn').value,button_url:$('#bUrl').value,target_audience:$('#bAudience').value})});out.className='text-emerald-400 text-sm mt-3';out.textContent=`Draft ${d.data?.broadcast?.id||''} created. Use the send action from the broadcast workflow.`;broadcast()}catch(x){out.className='text-red-400 text-sm mt-3';out.textContent=x.message}}
async function audit(){const d=await api('/api/admin/audit-logs?limit=50');const rows=d.data?.logs||d.logs||[];$('#content').innerHTML=`<h2 class="text-2xl font-bold mb-5">Audit Logs</h2><div class="card overflow-auto"><table class="w-full text-sm"><thead><tr class="border-b border-slate-700"><th class="p-3">Time</th><th class="p-3">Actor</th><th class="p-3">Action</th><th class="p-3">Target</th></tr></thead><tbody>${rows.map(r=>`<tr class="border-b border-slate-800"><td class="p-3">${esc(r.created_at)}</td><td class="p-3">${esc(r.actor_id)}</td><td class="p-3">${esc(r.action)}</td><td class="p-3">${esc(r.target_type)} ${esc(r.target_id)}</td></tr>`).join('')}</tbody></table></div>`}
$$('[data-tab]').forEach(b=>b.onclick=()=>loadTab(b.dataset.tab));$('#loginForm').onsubmit=login;$('#logout').onclick=logout;
(async()=>{try{await api('/api/admin/dashboard?range=7d');showApp();loadTab('dashboard')}catch(_){showLogin()}})();
</script>
</body>
</html>
