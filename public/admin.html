<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TeleShort Admin</title><script src="https://cdn.tailwindcss.com"></script><style>body{font-family:system-ui;background:#0f172a;color:#f8fafc}.card{background:#1e293b;border:1px solid #334155;border-radius:16px}.hidden{display:none!important}.nav.active{background:#4f46e5}</style></head><body class="min-h-screen"><div id="login" class="min-h-screen grid place-items-center p-5"><form id="loginForm" class="card w-full max-w-sm p-7"><h1 class="text-2xl font-bold">TeleShort Admin</h1><p class="text-sm text-slate-400 mb-5">Secure administrator sign-in</p><input id="username" autocomplete="username" required placeholder="Username" class="w-full mb-3 p-3 rounded bg-slate-900 border border-slate-700"><input id="password" type="password" autocomplete="current-password" required placeholder="Password" class="w-full mb-4 p-3 rounded bg-slate-900 border border-slate-700"><button class="w-full p-3 rounded bg-indigo-600 font-bold">Sign in</button><p id="loginError" class="text-red-400 text-sm mt-3"></p></form></div><div id="app" class="hidden min-h-screen md:flex"><aside class="w-64 bg-slate-950 p-4 flex-col hidden md:flex"><h1 class="text-xl font-bold mb-6">⚡ TeleShort</h1><div class="flex-1 space-y-2"><button data-tab="dashboard" class="nav active w-full text-left p-3 rounded">Dashboard</button><button data-tab="users" class="nav w-full text-left p-3 rounded">Users</button><button data-tab="withdrawals" class="nav w-full text-left p-3 rounded">Withdrawals</button><button data-tab="settings" class="nav w-full text-left p-3 rounded">Settings</button><button data-tab="broadcast" class="nav w-full text-left p-3 rounded">Broadcast</button></div><button id="logout" class="p-3 rounded bg-red-950 text-red-300">Logout</button></aside><main class="flex-1 p-4 md:p-8 overflow-auto"><div id="mobileNav" class="md:hidden flex gap-2 overflow-auto mb-5"></div><section id="content"></section></main></div><script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>`₹${Number(n||0).toFixed(2)}`;
async function api(path,o={}){const r=await fetch(path,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(o.headers||{})},...o});const d=await r.json().catch(()=>({}));if(!r.ok||d.success===false)throw Error(d.error||`HTTP ${r.status}`);return d.data||d}
function loginView(){login.classList.remove('hidden');app.classList.add('hidden')}function appView(){login.classList.add('hidden');app.classList.remove('hidden')}
async function doLogin(e){e.preventDefault();loginError.textContent='';try{await api('/api/admin/auth/login',{method:'POST',body:JSON.stringify({username:username.value.trim(),password:password.value})});appView();load('dashboard')}catch(x){loginError.textContent=x.message}}
async function doLogout(){try{await api('/api/admin/auth/logout',{method:'POST',body:JSON.stringify({action:'logout'})})}finally{loginView()}}
async function load(tab){$$('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));content.innerHTML='<div class="card p-8 text-slate-400">Loading…</div>';try{if(tab==='dashboard')await dashboard();else if(tab==='users')await users();else if(tab==='withdrawals')await withdrawals();else if(tab==='settings')await settings();else await broadcast()}catch(x){content.innerHTML=`<div class="card p-6 text-red-400">${esc(x.message)}</div>`}}
async function dashboard(){const d=await api('/api/admin/dashboard?range=7d');content.innerHTML=`<h2 class="text-2xl font-bold mb-6">Dashboard</h2><div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4">${[['Users',d.users?.total],['New',d.users?.new_in_period],['Links',d.links?.total],['Clicks',d.traffic?.total_clicks],['Eligible',d.traffic?.eligible_clicks],['Creator rewards',money(d.financial?.total_creator_rewards_inr)],['Referral rewards',money(d.financial?.total_referral_rewards_inr)],['Pending payouts',money(d.financial?.pending_withdrawals_inr)]].map(([a,b])=>`<div class="card p-5"><div class="text-xs text-slate-400">${a}</div><div class="text-2xl font-bold mt-2">${esc(b)}</div></div>`).join('')}</div>`}
async function users(){const d=await api('/api/admin/users?limit=50');const rows=d.users||[];content.innerHTML=`<h2 class="text-2xl font-bold mb-5">Users</h2><div class="card overflow-auto"><table class="w-full text-sm"><thead><tr class="border-b border-slate-700"><th class="p-3 text-left">User</th><th class="p-3">Balance</th><th class="p-3">Status</th><th class="p-3">Action</th></tr></thead><tbody>${rows.map(u=>`<tr class="border-b border-slate-800"><td class="p-3">${esc(u.username||u.first_name||u.id)}</td><td class="p-3 text-center">${money(u.available_balance)}</td><td class="p-3 text-center">${esc(u.status)}</td><td class="p-3 text-center"><button class="px-3 py-1 rounded bg-slate-700" onclick="userAction('${esc(u.id)}','${String(u.status).toUpperCase()==='BANNED'?'UNBAN':'BAN'}')">${String(u.status).toUpperCase()==='BANNED'?'Unban':'Ban'}</button></td></tr>`).join('')}</tbody></table></div>`}
async function userAction(id,action){const reason=prompt('Reason:');if(['BAN','SUSPEND'].includes(action)&&!reason)return;await api('/api/admin/users/'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({action,reason})});load('users')}
async function withdrawals(){const d=await api('/api/admin/withdrawals?limit=50');const rows=d.withdrawals||[];content.innerHTML=`<h2 class="text-2xl font-bold mb-5">Withdrawals</h2><div class="card overflow-auto"><table class="w-full text-sm"><thead><tr class="border-b border-slate-700"><th class="p-3">ID</th><th class="p-3">Amount</th><th class="p-3">Method</th><th class="p-3">Status</th><th class="p-3">Action</th></tr></thead><tbody>${rows.map(w=>`<tr class="border-b border-slate-800"><td class="p-3">${esc(w.id)}</td><td class="p-3">${money(w.amount)}</td><td class="p-3">${esc(w.payment_method||w.method)}</td><td class="p-3">${esc(w.status)}</td><td class="p-3">${String(w.status).toUpperCase()==='PENDING'?`<button class="px-2 py-1 rounded bg-emerald-700 mr-1" onclick="decide('${esc(w.id)}','APPROVED')">Approve</button><button class="px-2 py-1 rounded bg-red-800" onclick="decide('${esc(w.id)}','REJECTED')">Reject</button>`:'-'}</td></tr>`).join('')}</tbody></table></div>`}
async function decide(id,status){const notes=prompt(status==='REJECTED'?'Reason required':'Admin notes');if(status==='REJECTED'&&!notes)return;await api('/api/admin/withdrawals/'+encodeURIComponent(id)+'/decision',{method:'POST',body:JSON.stringify({status,admin_notes:notes||null})});load('withdrawals')}
async function settings(){const d=await api('/api/admin/settings');const s=d.settings||{};const c=s.publisher_payout_cpm?.rate_inr??160,r=s.referral_config?.commission_percent??10,a=s.ads_config?.ads_per_link??2,t=s.ads_config?.timer_seconds??5,m=s.withdrawal_config?.min_threshold_inr??100;content.innerHTML=`<h2 class="text-2xl font-bold mb-5">Settings</h2><div class="card p-6 max-w-2xl space-y-4"><label>Publisher CPM<input id="cpm" type="number" value="${esc(c)}" class="w-full mt-1 p-3 rounded bg-slate-900"></label><label>Referral %<input id="ref" type="number" value="${esc(r)}" class="w-full mt-1 p-3 rounded bg-slate-900"></label><label>Ads per link<input id="ads" type="number" value="${esc(a)}" class="w-full mt-1 p-3 rounded bg-slate-900"></label><label>Timer seconds<input id="timer" type="number" value="${esc(t)}" class="w-full mt-1 p-3 rounded bg-slate-900"></label><label>Minimum withdrawal<input id="min" type="number" value="${esc(m)}" class="w-full mt-1 p-3 rounded bg-slate-900"></label><button onclick="saveSettings()" class="px-5 py-3 rounded bg-indigo-600 font-bold">Save</button><p id="settingsMsg" class="text-sm"></p></div>`}
async function saveSettings(){try{for(const [key,value] of [['publisher_payout_cpm',{rate_inr:+cpm.value}],['referral_config',{commission_percent:+ref.value}],['ads_config',{ads_per_link:+ads.value,timer_seconds:+timer.value}],['withdrawal_config',{min_threshold_inr:+min.value}]])await api('/api/admin/settings',{method:'PATCH',body:JSON.stringify({key,value,reason:'Admin settings update'})});settingsMsg.className='text-emerald-400';settingsMsg.textContent='Saved.'}catch(x){settingsMsg.className='text-red-400';settingsMsg.textContent=x.message}}
async function broadcast(){content.innerHTML='<h2 class="text-2xl font-bold mb-5">Broadcast</h2><div class="card p-6 max-w-2xl"><textarea id="bmsg" rows="6" maxlength="4000" placeholder="Message" class="w-full p-3 rounded bg-slate-900"></textarea><button class="mt-4 px-5 py-3 rounded bg-amber-600 font-bold" onclick="createBroadcast()">Create Draft</button><p id="bout" class="text-sm mt-3"></p></div>'}
async function createBroadcast(){try{const d=await api('/api/admin/broadcasts',{method:'POST',body:JSON.stringify({message:bmsg.value,target_audience:'ALL_USERS'})});bout.className='text-emerald-400';bout.textContent='Draft created: '+(d.broadcast?.id||'ok')}catch(x){bout.className='text-red-400';bout.textContent=x.message}}
$$('[data-tab]').forEach(b=>b.onclick=()=>load(b.dataset.tab));loginForm.onsubmit=doLogin;logout.onclick=doLogout;
(async()=>{try{await api('/api/admin/dashboard?range=7d');appView();load('dashboard')}catch(_){loginView()}})();
</script></body></html>
